spring:
  application:
    name: trek-management-system

  config:
    import: optional:file:.env

  profiles:
    active: ${APP_ENV:dev}

  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trek_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile
    hikari:
      pool-name: TrekHikariPool
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Mail ────────────────────────────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ── Servlet ─────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never         # Never leak internal messages
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ── Application-specific ──────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL}

  # JWT
  jwt:
    secret: ${JWT_SECRET}               # HS256 key — min 256 bits, base64-encoded
    access-token-expiry-ms: 900000      # 15 minutes
    refresh-token-expiry-days: 30

  # CORS — tightened per security architecture
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}   # e.g. https://yourdomain.com,https://admin.yourdomain.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

  # Razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    currency: INR
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

  # Supabase Storage
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
    storage:
      bucket-images: trek-images
      bucket-itineraries: itineraries
      bucket-invoices: invoices
      bucket-gallery: gallery          # kept as-is — will later hold more than trek gallery images
      bucket-avatars: avatars
      bucket-blog-images: blog-images
      signed-url-expiry-seconds: 3600

  # Storage module's own validation policy (separate from Supabase connection/bucket config above)
  storage:
    max-image-size: 10485760   # 10 MB
    max-pdf-size: 26214400     # 25 MB
    allowed-image-mime-types: image/jpeg,image/png,image/webp
    allowed-pdf-mime-types: application/pdf

  # Mail sender identity
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:Trek Management System}
    base-url: ${APP_BASE_URL}  # used for email links (verify, reset password)

  # Rate limiting (Bucket4j — in-memory, single instance)
  rate-limit:
    auth-endpoints:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60
    general-endpoints:
      capacity: 100
      refill-tokens: 100
      refill-duration-seconds: 60

  # Booking business rules
  booking:
    cancellation-window-hours: 48      # Customer can cancel up to 48h before trek start
    invoice-url-expiry-seconds: 3600
    expiry-check-interval: 300000

  # Invoice generation
  invoice:
    gst-rate: 18

---
# ── Dev profile ───────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true

---
# ── Prod profile ──────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false     # Disable Swagger UI in production
  api-docs:
    enabled: false

management:
  health:
    mail:
      enabled: false
