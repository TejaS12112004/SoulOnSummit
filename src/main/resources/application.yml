spring:
  application:
    name: trek-management-system

  config:
    import: optional:file:.env

  profiles:
    active: ${APP_ENV:dev}

  # ── DataSource ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trek_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: TrekHikariPool
      minimum-idle: 1
      maximum-pool-size: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── Google OAuth2 ───────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

  # ── Mail ────────────────────────────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  # ── Jackson ─────────────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ── Servlet ─────────────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB


# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false


# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}


# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

  show-actuator: false


# ── Application-specific ──────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL}

  # JWT
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000
    refresh-token-expiry-days: 30

  # CORS
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600

  # Razorpay
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    currency: INR
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

  # Supabase Storage
  supabase:
    url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

    storage:
      bucket-images: trek-images
      bucket-itineraries: itineraries
      bucket-invoices: invoices
      bucket-gallery: gallery
      bucket-avatars: avatars
      bucket-blog-images: blog-images
      signed-url-expiry-seconds: 3600

  # Storage validation
  storage:
    max-image-size: 10485760
    max-pdf-size: 26214400
    allowed-image-mime-types: image/jpeg,image/png,image/webp
    allowed-pdf-mime-types: application/pdf

  # Mail sender
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:Trek Management System}
    base-url: ${APP_BASE_URL}

  # Rate limiting
  rate-limit:
    auth-endpoints:
      capacity: 10
      refill-tokens: 10
      refill-duration-seconds: 60

    general-endpoints:
      capacity: 100
      refill-tokens: 100
      refill-duration-seconds: 60

  # Booking
  booking:
    cancellation-window-hours: 48
    invoice-url-expiry-seconds: 3600
    expiry-check-interval: 300000

  # Invoice
  invoice:
    gst-rate: 18


---
# ── Development Profile ───────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true


---
# ── Production Profile ────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false

  api-docs:
    enabled: false

# Gmail SMTP connectivity should not make the entire application unhealthy.
management:
  health:
    mail:
      enabled: false